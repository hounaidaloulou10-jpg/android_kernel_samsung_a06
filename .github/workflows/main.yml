name: Build A06 KernelSU & APatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3 git curl zip unzip cpio lz4

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          curl -L https://github.com -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang

      - name: Integrate KernelSU & Enable KALLSYMS
        run: |
          curl -LSs "https://githubusercontent.com" | bash -s v0.9.5
          echo "CONFIG_KSU=y" >> arch/arm64/configs/a06_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/a06_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/a06_defconfig
          echo "CONFIG_SECURITY_DEFEX=n" >> arch/arm64/configs/a06_defconfig
          echo "CONFIG_PROCA=n" >> arch/arm64/configs/a06_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"
          make O=out ARCH=arm64 a06_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb

      - name: Upload Built Kernel
        uses: actions/upload-artifact@v4
        with:
          name: A065F-KernelSU-APatch-Image
          path: out/arch/arm64/boot/Image.gz-dtb
